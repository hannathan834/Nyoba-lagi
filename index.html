<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Game Mobil</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#222;
    font-family:Arial,sans-serif;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:#4caf50;
}

/* JALAN */
#road{
    position:absolute;
    left:50%;
    top:0;
    transform:translateX(-50%);
    width:82%;
    max-width:520px;
    height:100%;
    background:#3d3d3d;
    border-left:8px solid white;
    border-right:8px solid white;
    overflow:hidden;
}

/* GARIS TENGAH */
.line{
    position:absolute;
    width:10px;
    height:80px;
    background:white;
    left:50%;
    transform:translateX(-50%);
}

/* JUDUL */
#title{
    position:absolute;
    z-index:30;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.8);
    color:white;
    padding:12px 25px;
    border-radius:30px;
    font-size:24px;
    font-weight:bold;
    white-space:nowrap;
}

/* SKOR */
#score{
    position:absolute;
    z-index:30;
    top:90px;
    left:15px;
    background:rgba(0,0,0,.7);
    color:white;
    padding:10px 15px;
    border-radius:10px;
    font-size:20px;
}

/* MOBIL */
#car{
    position:absolute;
    z-index:20;
    width:75px;
    height:135px;
    left:50%;
    bottom:175px;
    transform:translateX(-50%);
    transition:transform .1s;
}

/* BADAN */
.carBody{
    width:100%;
    height:100%;
    position:absolute;
    background:linear-gradient(
        90deg,
        #850000,
        red,
        #850000
    );
    border:4px solid #550000;
    border-radius:20px;
    box-shadow:0 5px 12px #111;
}

/* KACA */
.front{
    position:absolute;
    top:20px;
    left:11px;
    width:47px;
    height:40px;
    background:#61c5ef;
    border:4px solid #222;
    border-radius:10px;
}

.back{
    position:absolute;
    bottom:18px;
    left:11px;
    width:47px;
    height:30px;
    background:#61c5ef;
    border:4px solid #222;
    border-radius:8px;
}

/* LAMPU */
.lamp{
    position:absolute;
    top:7px;
    width:14px;
    height:10px;
    background:white;
    border-radius:5px;
}

.lamp1{left:9px;}
.lamp2{right:9px;}

/* BAN */
.wheel{
    position:absolute;
    width:13px;
    height:35px;
    background:#111;
    border-radius:8px;
}

.w1{left:-9px;top:35px;}
.w2{right:-9px;top:35px;}
.w3{left:-9px;bottom:25px;}
.w4{right:-9px;bottom:25px;}

/* RINTANGAN */
.obstacle{
    position:absolute;
    z-index:15;
    width:65px;
    height:65px;
    background:#ff5722;
    border:6px solid #ffe600;
    border-radius:12px;
    box-shadow:0 5px 10px #111;
}

/* TANDA RINTANGAN */
.obstacle span{
    display:flex;
    width:100%;
    height:100%;
    align-items:center;
    justify-content:center;
    font-size:35px;
}

/* TOMBOL */
.controls{
    position:absolute;
    z-index:40;
    bottom:25px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:35px;
}

.btn{
    width:100px;
    height:70px;
    border:0;
    border-radius:20px;
    background:#111;
    color:white;
    font-size:40px;
    box-shadow:0 5px 10px #222;
}

.btn:active{
    transform:scale(.9);
    background:#555;
}

/* GAME OVER */
#over{
    display:none;
    position:absolute;
    z-index:100;
    width:100%;
    height:100%;
    top:0;
    left:0;
    background:rgba(0,0,0,.85);
    color:white;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}

#over h1{
    font-size:42px;
    margin-bottom:15px;
}

#over p{
    font-size:22px;
    margin-bottom:25px;
}

#again{
    padding:15px 30px;
    border:0;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
}

/* HP */
@media(max-width:600px){
    #road{
        width:82%;
    }

    #title{
        font-size:22px;
        top:25px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="road"></div>

    <div id="title">🚗 GAME MOBIL</div>

    <div id="score">
        Jarak: <span id="scoreNumber">0</span> m
    </div>

    <!-- MOBIL -->
    <div id="car">

        <div class="carBody">

            <div class="lamp lamp1"></div>
            <div class="lamp lamp2"></div>

            <div class="front"></div>
            <div class="back"></div>

            <div class="wheel w1"></div>
            <div class="wheel w2"></div>
            <div class="wheel w3"></div>
            <div class="wheel w4"></div>

        </div>

    </div>

    <!-- TOMBOL -->
    <div class="controls">

        <button class="btn" id="left">⬅️</button>

        <button class="btn" id="right">➡️</button>

    </div>

    <!-- GAME OVER -->
    <div id="over">

        <h1>💥 GAME OVER</h1>

        <p>
            Jarak kamu:
            <span id="final">0</span> m
        </p>

        <button id="again">
            🔄 MAIN LAGI
        </button>

    </div>

</div>

<script>

/* =========================
   VARIABEL
========================= */

const game = document.getElementById("game");
const road = document.getElementById("road");
const car = document.getElementById("car");

const left = document.getElementById("left");
const right = document.getElementById("right");

const scoreNumber =
document.getElementById("scoreNumber");

const over =
document.getElementById("over");

const final =
document.getElementById("final");

const again =
document.getElementById("again");

let carX = 50;

let leftMove = false;
let rightMove = false;

let obstacles = [];

let score = 0;

let playing = true;


/* =========================
   GARIS JALAN
========================= */

let lines = [];

for(let i=0;i<8;i++){

    let line =
    document.createElement("div");

    line.className="line";

    line.style.top =
    (i*110)+"px";

    road.appendChild(line);

    lines.push({
        element:line,
        y:i*110
    });

}


/* =========================
   KONTROL MOBIL
========================= */

function startLeft(e){
    e.preventDefault();
    leftMove=true;
}

function stopLeft(e){
    e.preventDefault();
    leftMove=false;
}

function startRight(e){
    e.preventDefault();
    rightMove=true;
}

function stopRight(e){
    e.preventDefault();
    rightMove=false;
}


/* TOUCH */

left.addEventListener("touchstart",startLeft);
left.addEventListener("touchend",stopLeft);

right.addEventListener("touchstart",startRight);
right.addEventListener("touchend",stopRight);


/* MOUSE */

left.addEventListener("mousedown",startLeft);
left.addEventListener("mouseup",stopLeft);

right.addEventListener("mousedown",startRight);
right.addEventListener("mouseup",stopRight);


/* =========================
   BUAT RINTANGAN
========================= */

function makeObstacle(){

    if(!playing)return;

    const obstacle =
    document.createElement("div");

    obstacle.className="obstacle";

    /* ICON RINTANGAN */
    obstacle.innerHTML="<span>🚧</span>";

    /*
       POSISI RINTANGAN
       15% sampai 85%
    */

    let x =
    15 + Math.random()*70;

    obstacle.style.left=x+"%";

    /*
       MULAI DARI ATAS
    */

    obstacle.style.top="-80px";

    road.appendChild(obstacle);

    obstacles.push({

        element:obstacle,

        x:x,

        y:-80

    });

}


/* =========================
   GERAK RINTANGAN
========================= */

function moveObstacles(){

    for(let i=obstacles.length-1;i>=0;i--){

        let o=obstacles[i];

        /*
           RINTANGAN TURUN
        */

        o.y += 6;

        o.element.style.top =
        o.y+"px";


        /*
           CEK TABRAKAN
        */

        let carBox =
        car.getBoundingClientRect();

        let obstacleBox =
        o.element.getBoundingClientRect();


        if(

            carBox.left <
            obstacleBox.right &&

            carBox.right >
            obstacleBox.left &&

            carBox.top <
            obstacleBox.bottom &&

            carBox.bottom >
            obstacleBox.top

        ){

            gameOver();

            return;

        }


        /*
           HAPUS JIKA SUDAH LEWAT
        */

        if(o.y > window.innerHeight){

            o.element.remove();

            obstacles.splice(i,1);

        }

    }

}


/* =========================
   GERAK JALAN
========================= */

function moveLines(){

    for(let l of lines){

        l.y += 6;

        if(l.y > window.innerHeight){

            l.y=-100;

        }

        l.element.style.top=
        l.y+"px";

    }

}


/* =========================
   GERAK MOBIL
========================= */

function moveCar(){

    if(!playing)return;

    if(leftMove){

        carX -= 0.9;

        car.style.transform =
        "translateX(-50%) rotate(-10deg)";

    }

    else if(rightMove){

        carX += 0.9;

        car.style.transform =
        "translateX(-50%) rotate(10deg)";

    }

    else{

        car.style.transform =
        "translateX(-50%) rotate(0deg)";

    }


    /*
       BATAS JALAN
    */

    if(carX<13)carX=13;

    if(carX>87)carX=87;

    car.style.left=
    carX+"%";

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    playing=false;

    leftMove=false;
    rightMove=false;

    final.textContent=score;

    over.style.display="flex";

}


/* =========================
   MAIN LAGI
========================= */

again.addEventListener("click",function(){

    for(let o of obstacles){

        o.element.remove();

    }

    obstacles=[];

    carX=50;

    score=0;

    scoreNumber.textContent="0";

    car.style.left="50%";

    playing=true;

    over.style.display="none";

});


/* =========================
   GAME LOOP
========================= */

function loop(){

    moveCar();
