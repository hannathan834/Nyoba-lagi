<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Game Mobil</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #55a832;
}

/* LANGIT */
#sky {
    position: absolute;
    width: 100%;
    height: 35%;
    top: 0;
    background: linear-gradient(#4fc3f7, #d9f5ff);
}

/* JALAN */
#road {
    position: absolute;
    width: 80%;
    max-width: 500px;
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #383838;
    overflow: hidden;
    border-left: 8px solid white;
    border-right: 8px solid white;
}

/* GARIS JALAN */
.roadLine {
    position: absolute;
    width: 10px;
    height: 80px;
    background: white;
    left: 50%;
    transform: translateX(-50%);
}

/* SKOR */
#scoreBox {
    position: absolute;
    z-index: 20;
    top: 15px;
    left: 15px;
    padding: 10px 15px;
    background: rgba(0,0,0,0.65);
    color: white;
    border-radius: 10px;
    font-size: 20px;
    font-weight: bold;
}

/* MOBIL */
#car {
    position: absolute;
    z-index: 10;

    width: 75px;
    height: 135px;

    left: 50%;
    bottom: 170px;

    transform: translateX(-50%);
}

/* BADAN MOBIL */
.carBody {
    position: absolute;
    width: 100%;
    height: 100%;

    background: linear-gradient(
        90deg,
        #8b0000,
        #ff2525,
        #8b0000
    );

    border: 3px solid #550000;
    border-radius: 20px 20px 12px 12px;

    box-shadow: 0 5px 12px rgba(0,0,0,0.6);
}

/* KACA DEPAN */
.frontWindow {
    position: absolute;
    top: 20px;
    left: 11px;

    width: 47px;
    height: 38px;

    background: #8bdcff;
    border: 3px solid #222;
    border-radius: 10px;
}

/* KACA BELAKANG */
.backWindow {
    position: absolute;
    bottom: 18px;
    left: 12px;

    width: 45px;
    height: 28px;

    background: #21708e;
    border: 3px solid #222;
    border-radius: 6px;
}

/* LAMPU */
.light {
    position: absolute;
    top: 7px;

    width: 13px;
    height: 9px;

    background: #fff45c;
    border-radius: 5px;
}

.light.left {
    left: 8px;
}

.light.right {
    right: 8px;
}

/* BAN */
.wheel {
    position: absolute;

    width: 12px;
    height: 32px;

    background: #111;
    border-radius: 7px;
}

.wheel1 {
    left: -7px;
    top: 35px;
}

.wheel2 {
    right: -7px;
    top: 35px;
}

.wheel3 {
    left: -7px;
    bottom: 25px;
}

.wheel4 {
    right: -7px;
    bottom: 25px;
}

/* RINTANGAN */
.obstacle {
    position: absolute;
    z-index: 8;

    width: 55px;
    height: 55px;

    background: #222;

    border: 5px solid #ffcc00;

    border-radius: 10px;

    box-shadow: 0 4px 8px rgba(0,0,0,0.6);
}

/* POLA RINTANGAN */
.obstacle::after {
    content: "";
    position: absolute;

    width: 100%;
    height: 10px;

    top: 18px;
    left: 0;

    background: #ffcc00;
}

/* TOMBOL */
.controls {
    position: absolute;

    z-index: 30;

    width: 100%;

    bottom: 25px;

    display: flex;
    justify-content: center;

    gap: 25px;
}

.controlButton {
    width: 90px;
    height: 65px;

    border: none;
    border-radius: 18px;

    background: rgba(0,0,0,0.75);

    color: white;

    font-size: 38px;
    font-weight: bold;

    box-shadow: 0 5px 10px rgba(0,0,0,0.5);
}

.controlButton:active {
    transform: scale(0.9);
    background: #555;
}

/* GAME OVER */
#gameOver {
    display: none;

    position: absolute;

    z-index: 50;

    width: 100%;
    height: 100%;

    top: 0;
    left: 0;

    background: rgba(0,0,0,0.8);

    color: white;

    text-align: center;

    align-items: center;
    justify-content: center;

    flex-direction: column;
}

#gameOver h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

#gameOver p {
    font-size: 22px;
    margin-bottom: 25px;
}

#restart {
    padding: 14px 30px;

    border: none;
    border-radius: 12px;

    background: white;

    color: black;

    font-size: 20px;
    font-weight: bold;
}

/* HP */
@media (max-width: 600px) {

    #road {
        width: 82%;
    }

    #car {
        width: 75px;
        height: 135px;
        bottom: 165px;
    }

}
</style>
</head>

<body>

<div id="game">

    <!-- LANGIT -->
    <div id="sky"></div>

    <!-- JALAN -->
    <div id="road"></div>

    <!-- SKOR -->
    <div id="scoreBox">
        Jarak: <span id="score">0</span> m
    </div>

    <!-- MOBIL -->
    <div id="car">

        <div class="carBody">

            <div class="light left"></div>
            <div class="light right"></div>

            <div class="frontWindow"></div>
            <div class="backWindow"></div>

            <div class="wheel wheel1"></div>
            <div class="wheel wheel2"></div>
            <div class="wheel wheel3"></div>
            <div class="wheel wheel4"></div>

        </div>

    </div>

    <!-- TOMBOL -->
    <div class="controls">

        <button class="controlButton" id="leftButton">
            ⬅
        </button>

        <button class="controlButton" id="rightButton">
            ➡
        </button>

    </div>

    <!-- GAME OVER -->
    <div id="gameOver">

        <h1>GAME OVER</h1>

        <p>
            Jarak: <span id="finalScore">0</span> m
        </p>

        <button id="restart">
            MAIN LAGI
        </button>

    </div>

</div>

<script>

/* =========================
   VARIABEL
========================= */

const game = document.getElementById("game");
const road = document.getElementById("road");
const car = document.getElementById("car");

const leftButton = document.getElementById("leftButton");
const rightButton = document.getElementById("rightButton");

const scoreText = document.getElementById("score");
const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");
const restart = document.getElementById("restart");

let carX = 50;

let movingLeft = false;
let movingRight = false;

let score = 0;

let gameRunning = true;

let obstacles = [];

let roadLines = [];


/* =========================
   GARIS JALAN
========================= */

function createRoadLines() {

    for (let i = 0; i < 8; i++) {

        const line = document.createElement("div");

        line.className = "roadLine";

        line.style.top = (i * 100) + "px";

        road.appendChild(line);

        roadLines.push({
            element: line,
            y: i * 100
        });

    }

}

createRoadLines();


/* =========================
   MOBIL
========================= */

function moveCar() {

    if (!gameRunning) return;

    if (movingLeft) {
        carX -= 0.8;
    }

    if (movingRight) {
        carX += 0.8;
    }

    /* BATAS KIRI */
    if (carX < 12) {
        carX = 12;
    }

    /* BATAS KANAN */
    if (carX > 88) {
        carX = 88;
    }

    car.style.left = carX + "%";

    /* MOBIL MIRING SAAT BELOK */

    if (movingLeft) {

        car.style.transform =
            "translateX(-50%) rotate(-10deg)";

    }
    else if (movingRight) {

        car.style.transform =
            "translateX(-50%) rotate(10deg)";

    }
    else {

        car.style.transform =
            "translateX(-50%) rotate(0deg)";

    }

}


/* =========================
   TOMBOL KIRI
========================= */

function leftDown(e) {

    e.preventDefault();

    movingLeft = true;

}

function leftUp(e) {

    e.preventDefault();

    movingLeft = false;

}

leftButton.addEventListener("touchstart", leftDown);
leftButton.addEventListener("touchend", leftUp);
leftButton
