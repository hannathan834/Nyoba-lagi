<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Game Mobil</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
    font-family: Arial, sans-serif;
    background: #222;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #48a52e;
}

/* JALAN */
#road {
    position: absolute;
    width: min(82vw, 520px);
    height: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: #414141;
    border-left: 14px solid white;
    border-right: 14px solid white;
    overflow: hidden;
}

/* GARIS JALAN */
#roadLine {
    position: absolute;
    width: 10px;
    height: 200%;
    left: 50%;
    top: -100%;
    transform: translateX(-50%);
    background: repeating-linear-gradient(
        to bottom,
        white 0px,
        white 90px,
        transparent 90px,
        transparent 180px
    );
}

/* JUDUL */
#title {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.8);
    color: white;
    padding: 15px 30px;
    border-radius: 35px;
    font-size: 25px;
    font-weight: bold;
    z-index: 20;
    white-space: nowrap;
}

/* SCORE */
#scoreBox {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 30;
    color: white;
    background: rgba(0,0,0,.75);
    padding: 10px 16px;
    border-radius: 15px;
    font-size: 20px;
    font-weight: bold;
}

/* MOBIL */
#car {
    position: absolute;
    width: 85px;
    height: 150px;
    left: 50%;
    bottom: 185px;
    transform: translateX(-50%);
    z-index: 10;
    transition: transform .1s;
}

.carBody {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        #a90000,
        #ff1616,
        #a90000
    );
    border: 4px solid #720000;
    border-radius: 23px;
    box-shadow: 0 6px 10px rgba(0,0,0,.5);
}

.window {
    position: absolute;
    left: 12px;
    top: 25px;
    width: 61px;
    height: 44px;
    background: #5fc4ef;
    border: 4px solid #222;
    border-radius: 13px;
}

.window2 {
    position: absolute;
    left: 13px;
    bottom: 25px;
    width: 59px;
    height: 35px;
    background: #5fc4ef;
    border: 4px solid #222;
    border-radius: 10px;
}

.wheel {
    position: absolute;
    width: 14px;
    height: 38px;
    background: #111;
    border-radius: 9px;
}

.w1 { left: -9px; top: 40px; }
.w2 { right: -9px; top: 40px; }
.w3 { left: -9px; bottom: 28px; }
.w4 { right: -9px; bottom: 28px; }

.light {
    position: absolute;
    width: 17px;
    height: 11px;
    background: #fff;
    border-radius: 6px;
    top: 8px;
}

.l1 { left: 10px; }
.l2 { right: 10px; }

/* RINTANGAN */
.obstacle {
    position: absolute;
    width: 65px;
    height: 85px;
    top: -100px;
    z-index: 8;
    border-radius: 12px;
    background: linear-gradient(
        90deg,
        #1769aa,
        #35a9ff,
        #1769aa
    );
    border: 4px solid #0b3c63;
    box-shadow: 0 5px 10px rgba(0,0,0,.5);
}

.obstacle::before {
    content: "";
    position: absolute;
    top: 13px;
    left: 9px;
    width: 39px;
    height: 25px;
    background: #222;
    border-radius: 6px;
}

.obstacle::after {
    content: "";
    position: absolute;
    bottom: 12px;
    left: 9px;
    width: 39px;
    height: 20px;
    background: #222;
    border-radius: 6px;
}

/* TOMBOL */
.controls {
    position: absolute;
    bottom: 25px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 35px;
    z-index: 30;
}

.controlBtn {
    width: 100px;
    height: 70px;
    border: 0;
    border-radius: 22px;
    background: rgba(0,0,0,.85);
    color: white;
    font-size: 42px;
    box-shadow: 0 6px 12px rgba(0,0,0,.5);
}

.controlBtn:active {
    transform: scale(.92);
    background: #555;
}

/* MENU MULAI */
#startScreen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
}

.startBox {
    text-align: center;
    background: rgba(20,20,20,.95);
    padding: 35px 30px;
    border-radius: 25px;
    color: white;
    width: 80%;
    max-width: 350px;
}

.startBox h1 {
    font-size: 30px;
    margin-bottom: 12px;
}

.startBox p {
    margin-bottom: 25px;
    color: #ddd;
}

#startBtn {
    border: 0;
    padding: 16px 40px;
    border-radius: 15px;
    background: #16a34a;
    color: white;
    font-size: 23px;
    font-weight: bold;
}

#startBtn:active {
    transform: scale(.94);
}

/* GAME OVER */
#gameOver {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 110;
    background: rgba(0,0,0,.7);
    align-items: center;
    justify-content: center;
}

.gameOverBox {
    background: #181818;
    color: white;
    text-align: center;
    padding: 35px;
    border-radius: 25px;
}

.gameOverBox h2 {
    font-size: 32px;
    margin-bottom: 15px;
}

#restartBtn {
    margin-top: 20px;
    padding: 14px 30px;
    border: 0;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
}

/* HP */
@media (max-width: 600px) {
    #title {
        font-size: 21px;
        top: 25px;
    }

    #car {
        bottom: 180px;
    }

    .controls {
        bottom: 22px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="road">
        <div id="roadLine"></div>

        <!-- MOBIL -->
        <div id="car">
            <div class="carBody">
                <div class="light l1"></div>
                <div class="light l2"></div>

                <div class="window"></div>
                <div class="window2"></div>

                <div class="wheel w1"></div>
                <div class="wheel w2"></div>
                <div class="wheel w3"></div>
                <div class="wheel w4"></div>
            </div>
        </div>

    </div>

    <div id="title">🚗 GAME MOBIL</div>

    <div id="scoreBox">
        SCORE: <span id="score">0</span>
    </div>

    <!-- TOMBOL -->
    <div class="controls">
        <button class="controlBtn" id="leftBtn">⬅️</button>
        <button class="controlBtn" id="rightBtn">➡️</button>
    </div>

    <!-- MENU MULAI -->
    <div id="startScreen">
        <div class="startBox">
            <h1>🚗 GAME MOBIL</h1>
            <p>Hindari semua rintangan!</p>
            <button id="startBtn">▶ MULAI</button>
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="gameOver">
        <div class="gameOverBox">
            <h2>💥 GAME OVER</h2>
            <div>Score kamu:</div>
            <h1 id="finalScore">0</h1>
            <button id="restartBtn">🔄 MAIN LAGI</button>
        </div>
    </div>

</div>

<script>

const car = document.getElementById("car");
const road = document.getElementById("road");
const leftBtn = document.getElementById("leftBtn");
const rightBtn = document.getElementById("rightBtn");

const startScreen = document.getElementById("startScreen");
const startBtn = document.getElementById("startBtn");

const gameOver = document.getElementById("gameOver");
const restartBtn = document.getElementById("restartBtn");

const scoreText = document.getElementById("score");
const finalScore = document.getElementById("finalScore");
const roadLine = document.getElementById("roadLine");

let carX = 50;
let direction = 0;
let score = 0;
let running = false;
let obstacles = [];

let speed = 5;
let spawnTimer = 0;
let lastTime = 0;


/* =========================
   MULAI GAME
========================= */

function startGame() {

    startScreen.style.display = "none";
    gameOver.style.display = "none";

    carX = 50;
    score = 0;
    speed = 5;
    direction = 0;

    scoreText.textContent = "0";

    obstacles.forEach(o => o.remove());
    obstacles = [];

    running = true;

    lastTime = performance.now();

    requestAnimationFrame(gameLoop);
}


/* =========================
   BUAT RINTANGAN
========================= */

function createObstacle() {

    const obstacle = document.createElement("div");

    obstacle.className = "obstacle";

    /*
      Rintangan hanya muncul
      di area jalan.
    */

    const roadWidth = road.clientWidth;

    const maxX = roadWidth - 75;

    const x = Math.random() * maxX + 5;

    obstacle.style.left = x + "px";
    obstacle.style.top = "-100px";

    road.appendChild(obstacle);

    obstacles.push({
        element: obstacle,
        x: x,
        y: -100,
        passed: false
    });
}


/* =========================
   GAME LOOP
========================= */

function gameLoop(time) {

    if (!running) return;

    const delta = time - lastTime;
    lastTime = time;

    /*
      GERAK MOBIL
    */

    if (direction !== 0) {

        carX += direction * 0.8;

        /*
          Batas supaya mobil
          tidak keluar jalan.
        */

        if (carX < 10) {
            carX = 10;
        }

        if (carX > 90) {
            carX = 90;
        }

        car.style.transform =
            "translateX(-50%) rotate(" +
            direction * 12 +
            "deg)";

    } else {

        car.style.transform =
            "translateX(-50%) rotate(0deg)";
    }

    car.style.left = carX + "%";


    /*
      GERAK GARIS JALAN
    */

    let linePosition =
        parseFloat(
            roadLine.dataset.pos || "0"
        );

    linePosition += speed;

    if (linePosition > 180) {
        linePosition = 0;
    }

    roadLine.style.transform =
        "translateX(-50%) translateY(" +
        linePosition +
        "px)";

    roadLine.dataset.pos = linePosition;


    /*
      RINTANGAN
    */

    spawnTimer += delta;

    if (spawnTimer > 1100) {

        createObstacle();

        spawnTimer = 0;
    }


    /*
      GERAKKAN RINTANGAN
    */

    for (let i = obstacles.length - 1; i >= 0; i--) {

        const o = obstacles[i];

        o.y += speed;

        o.element.style.top =
            o.y + "px";


        /*
          TAMBAH SCORE
          kalau rintangan berhasil dilewati
        */

        if (!o.passed && o.y > 300) {

            o.passed = true;

            score++;

            scoreText.textContent = score;

            /*
              Game semakin cepat
            */

            if (score % 5 === 0) {
                speed += 0.7;
            }
        }


        /*
          HAPUS RINTANGAN
          yang sudah lewat layar
        */

        if (o.y > road.clientHeight + 100) {

            o.element.remove();

            obstacles.splice(i, 1);

            continue;
        }


        /*
          CEK TABRAKAN
        */

        if (collision(car, o.element)) {

            endGame();

            return;
        }
    }

    requestAnimationFrame(gameLoop);
}


/* =========================
   CEK TABRAKAN
========================= */

function collision(a, b) {

    const A = a.getBoundingClientRect();
    const B = b.getBoundingClientRect();

    return !(
        A.right < B.left + 8 ||
        A.left > B.right - 8 ||
        A.bottom < B.top + 8 ||
        A.top > B.bottom - 8
    );
}


/* =========================
   GAME OVER
========================= */

function endGame() {

    running = false;

    finalScore.textContent = score;

    gameOver.style.display = "flex";
}


/* =========================
   KONTROL
========================= */

function leftDown(e) {

    e.preventDefault();

    if (running) {
        direction = -1;
    }
}

function rightDown(e) {

    e.preventDefault();

    if (running) {
        direction = 1;
    }
}

function stopMove(e) {

    e.preventDefault();

    direction = 0;
}


/* TOUCH HP */

leftBtn.addEventListener("touchstart", leftDown);
leftBtn.addEventListener("touchend", stopMove);
leftBtn.addEventListener("touchcancel", stopMove);

rightBtn.addEventListener("touchstart", rightDown);
rightBtn.addEventListener("touchend", stopMove);
rightBtn.addEventListener("touchcancel", stopMove);


/* MOUSE */

leftBtn.addEventListener("mousedown", leftDown);
leftBtn.addEventListener("mouseup", stopMove);
leftBtn.addEventListener("mouseleave", stopMove);

rightBtn.addEventListener("mousedown", rightDown);
rightBtn.addEventListener("mouseup", stopMove);
rightBtn.addEventListener("mouseleave", stopMove);


/* KEYBOARD */

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft") {
        direction = -1;
    }

    if (e.key === "ArrowRight") {
        direction = 1;
    }

});

document.addEventListener("keyup", function(e) {

    if (
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight"
    ) {
        direction = 0;
    }

});


/* =========================
   BUTTON MULAI
========================= */

startBtn.addEventListener("click", startGame);

restartBtn.addEventListener("click", startGame);

</script>

</body>
</html>
