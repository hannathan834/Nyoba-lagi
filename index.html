<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Game Mobil</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#55a832;
    font-family:Arial,sans-serif;
}

#game{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
    background:#55a832;
}

/* JALAN */
#road{
    position:absolute;
    width:82%;
    height:100%;
    left:9%;
    top:0;
    background:#444;
    border-left:8px solid white;
    border-right:8px solid white;
}

/* GARIS JALAN */
#roadLine{
    position:absolute;
    width:10px;
    height:100%;
    left:50%;
    transform:translateX(-50%);
    background:repeating-linear-gradient(
        to bottom,
        white 0px,
        white 60px,
        transparent 60px,
        transparent 120px
    );
    animation:jalan .5s linear infinite;
}

@keyframes jalan{
    from{background-position:0 0;}
    to{background-position:0 120px;}
}

/* MOBIL */
#car{
    position:absolute;
    width:80px;
    height:140px;
    left:50%;
    bottom:180px;
    transform:translateX(-50%);
    z-index:10;
    transition:transform .1s;
}

/* BADAN */
.body{
    position:absolute;
    width:70px;
    height:130px;
    left:5px;
    top:5px;
    background:#e60000;
    border:3px solid #700000;
    border-radius:18px;
}

/* KACA DEPAN */
.front{
    position:absolute;
    width:48px;
    height:38px;
    left:11px;
    top:15px;
    background:#65cfff;
    border:3px solid #222;
    border-radius:10px;
}

/* KACA BELAKANG */
.back{
    position:absolute;
    width:48px;
    height:28px;
    left:11px;
    bottom:15px;
    background:#65cfff;
    border:3px solid #222;
    border-radius:7px;
}

/* BAN */
.wheel{
    position:absolute;
    width:13px;
    height:35px;
    background:#111;
    border-radius:7px;
}

.w1{left:-6px;top:28px;}
.w2{right:-6px;top:28px;}
.w3{left:-6px;bottom:20px;}
.w4{right:-6px;bottom:20px;}

/* LAMPU */
.lamp{
    position:absolute;
    width:13px;
    height:9px;
    background:#fff;
    border-radius:4px;
    top:4px;
}

.l1{left:12px;}
.l2{right:12px;}

/* TOMBOL */
#buttons{
    position:absolute;
    bottom:25px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:30px;
    z-index:20;
}

button{
    width:95px;
    height:65px;
    border:0;
    border-radius:18px;
    background:#111;
    color:white;
    font-size:38px;
    font-weight:bold;
    box-shadow:0 4px 10px #000;
}

button:active{
    background:#777;
    transform:scale(.94);
}

/* JUDUL */
#title{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:#000b;
    padding:8px 18px;
    border-radius:12px;
    z-index:30;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

    <div id="road">
        <div id="roadLine"></div>
    </div>

    <div id="title">🚗 GAME MOBIL</div>

    <!-- MOBIL -->
    <div id="car">

        <div class="body">

            <div class="front"></div>
            <div class="back"></div>

            <div class="lamp l1"></div>
            <div class="lamp l2"></div>

        </div>

        <div class="wheel w1"></div>
        <div class="wheel w2"></div>
        <div class="wheel w3"></div>
        <div class="wheel w4"></div>

    </div>

    <!-- TOMBOL -->
    <div id="buttons">
        <button id="left">⬅️</button>
        <button id="right">➡️</button>
    </div>

</div>

<script>

var car = document.getElementById("car");

var posisi = 50;
var arah = 0;

function gerak(){

    posisi = posisi + (arah * 0.7);

    if(posisi < 18){
        posisi = 18;
    }

    if(posisi > 82){
        posisi = 82;
    }

    car.style.left = posisi + "%";

    if(arah < 0){
        car.style.transform =
        "translateX(-50%) rotate(-12deg)";
    }
    else if(arah > 0){
        car.style.transform =
        "translateX(-50%) rotate(12deg)";
    }
    else{
        car.style.transform =
        "translateX(-50%) rotate(0deg)";
    }

    requestAnimationFrame(gerak);
}

/* KIRI */
document.getElementById("left").addEventListener("touchstart",function(e){
    e.preventDefault();
    arah = -1;
});

document.getElementById("left").addEventListener("touchend",function(){
    arah = 0;
});

document.getElementById("left").addEventListener("mousedown",function(){
    arah = -1;
});

document.getElementById("left").addEventListener("mouseup",function(){
    arah = 0;
});

/* KANAN */
document.getElementById("right").addEventListener("touchstart",function(e){
    e.preventDefault();
    arah = 1;
});

document.getElementById("right").addEventListener("touchend",function(){
    arah = 0;
});

document.getElementById("right").addEventListener("mousedown",function(){
    arah = 1;
});

document.getElementById("right").addEventListener("mouseup",function(){
    arah = 0;
});

/* KEYBOARD */
document.addEventListener("keydown",function(e){

    if(e.key === "ArrowLeft"){
        arah = -1;
    }

    if(e.key === "ArrowRight"){
        arah = 1;
    }

});

document.addEventListener("keyup",function(e){

    if(e.key === "ArrowLeft" || e.key === "ArrowRight"){
        arah = 0;
    }

});

gerak();

</script>

</body>
</html>
